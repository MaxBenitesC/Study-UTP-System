<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChapaTuPromo | Ingresar</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos_chapatupromo.css">
  <link rel="icon" href="logo/chapatupromo.png" type="image/png">
</head>
<body>

  <header>
    <div class="header-top">
    <img src="logo/chapatupromo.png" alt="Logo ChapaTuPromo">
      <div class="header-texto">
    <h1>ChapaTuPromo</h1>
  </header>
  <hr>
  <section>
    <h2>Ingresa a tu cuenta</h2>

    <form action="#" method="post">

      <p>
        <label for="usuario">Correo electronico:</label><br>
        <input type="text" id="usuario" name="usuario" placeholder="tucorreo@gmail.com" required>
      </p>

      <p>
        <label for="contrasena">Contrasena:</label><br>
        <input type="text" id="contrasena" name="contrasena" placeholder="Tu contrasena" required>
      </p>

      <p>
        <button type="submit">Ingresar</button>
      </p>

    </form>

    <p>Si aún no tienes cuenta -> <a href="registrar_chapatupromo.html">Registrate aqui</a> y aprovecha nuestras ofertas</p>
    <hr>
    <p>Volver al Inicio: <a href="index.html">Inicio</a></p>
  </section>
  <footer>
    <p class="footer-siguenos">Siguenos en nuestras redes</p>
    <div class="footer-redes">
      <a href="https://instagram.com/ChapaTuPromo" target="_blank"><i class="fab fa-instagram"></i> Instagram</a>
      <a href="https://facebook.com/ChapaTuPromo" target="_blank"><i class="fab fa-facebook"></i> Facebook</a>
      <a href="https://tiktok.com/@ChapaTuPromo" target="_blank"><i class="fab fa-tiktok"></i> TikTok</a>
    </div>
    <p class="footer-copy">ChapaTuPromo &copy; 2026 | Todos los derechos reservados</p>
  </footer>

</body>
</html>
