const root = document.getElementById('quiz-root');

function renderTab(key, data) {
  const sec = document.createElement('section');
  sec.className = 'tab-content' + (key === 's6' ? ' active' : '');
  sec.id = 'tab-' + key;

  sec.innerHTML = `
    <div class="semana-header">
      <div>
        <h2>${data.title}</h2>
        <p>${data.subtitle} · 20 preguntas</p>
      </div>
      <div class="meta">
        <span class="score-pill" id="score-${key}">0 / 20</span>
        <button class="reset-btn" data-reset="${key}">↻ Reiniciar</button>
      </div>
    </div>
    <div id="questions-${key}"></div>
  `;

  const qContainer = sec.querySelector('#questions-' + key);
  data.questions.forEach((item, idx) => {
    const qDiv = document.createElement('div');
    qDiv.className = 'question';
    qDiv.id = `${key}-q${idx}`;
    qDiv.innerHTML = `
      <div class="q-num">Pregunta ${idx + 1}</div>
      <div class="q-text">${item.q}</div>
      <div class="options">
        ${item.opts.map((opt, i) => `
          <label data-opt="${i}">
            <input type="radio" name="${key}-${idx}" value="${i}">
            <span>${opt}</span>
          </label>
        `).join('')}
      </div>
      <div class="feedback" id="fb-${key}-${idx}"></div>
    `;
    qContainer.appendChild(qDiv);

    qDiv.querySelectorAll('input[type="radio"]').forEach(input => {
      input.addEventListener('change', () => handleAnswer(key, idx, parseInt(input.value)));
    });
  });

  root.appendChild(sec);
}

function handleAnswer(key, idx, chosen) {
  const data = QUIZ_DATA[key];
  const item = data.questions[idx];
  const qDiv = document.getElementById(`${key}-q${idx}`);
  if (qDiv.classList.contains('answered')) return;

  qDiv.classList.add('answered');
  const labels = qDiv.querySelectorAll('.options label');
  labels.forEach((lbl, i) => {
    lbl.querySelector('input').disabled = true;
    if (i === item.correct) lbl.classList.add('is-correct');
    else if (i === chosen) lbl.classList.add('is-wrong');
  });

  const fb = document.getElementById(`fb-${key}-${idx}`);
  const isCorrect = chosen === item.correct;
  qDiv.classList.add(isCorrect ? 'correct' : 'incorrect');
  fb.className = 'feedback show ' + (isCorrect ? 'correct' : 'incorrect');
  fb.innerHTML = `
    <strong>${isCorrect ? '✓ ¡Correcto!' : '✗ Incorrecto'}</strong>
    ${item.fb}
  `;

  updateScore(key);
}

function updateScore(key) {
  const data = QUIZ_DATA[key];
  let correct = 0;
  data.questions.forEach((_, idx) => {
    const qDiv = document.getElementById(`${key}-q${idx}`);
    if (qDiv && qDiv.classList.contains('correct')) correct++;
  });
  document.getElementById('score-' + key).textContent = `${correct} / ${data.questions.length}`;
}

function resetTab(key) {
  const data = QUIZ_DATA[key];
  data.questions.forEach((_, idx) => {
    const qDiv = document.getElementById(`${key}-q${idx}`);
    qDiv.classList.remove('answered', 'correct', 'incorrect');
    qDiv.querySelectorAll('.options label').forEach(lbl => {
      lbl.classList.remove('is-correct', 'is-wrong');
      const input = lbl.querySelector('input');
      input.disabled = false;
      input.checked = false;
    });
    const fb = document.getElementById(`fb-${key}-${idx}`);
    fb.className = 'feedback';
    fb.innerHTML = '';
  });
  updateScore(key);
  document.getElementById('tab-' + key).scrollIntoView({ behavior: 'smooth', block: 'start' });
}

Object.keys(QUIZ_DATA).forEach(k => renderTab(k, QUIZ_DATA[k]));

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const target = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab-' + target));
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});

document.addEventListener('click', e => {
  if (e.target.dataset.reset) resetTab(e.target.dataset.reset);
});
</script>
