<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Examen - Redes y Comunicación de Datos I</title>
    <style>
        :root {
            --primary-color: #c41e3a; /* Rojo UTP */
            --secondary-color: #2c3e50;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
            --success-color: #27ae60;
            --error-color: #e74c3c;
            --border-radius: 8px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 10px;
        }

        h1 { margin: 0; color: var(--secondary-color); }
        .author { font-size: 0.9em; color: #666; margin-top: 5px; }

        /* Pestañas */
        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .tab-btn {
            padding: 12px 20px;
            border: none;
            background: #ddd;
            cursor: pointer;
            border-radius: var(--border-radius) var(--border-radius) 0 0;
            font-weight: bold;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--primary-color);
            color: white;
        }

        .tab-btn:hover:not(.active) {
            background: #ccc;
        }

        /* Quiz Card */
        .quiz-container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 0 0 var(--border-radius) var(--border-radius);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            min-height: 400px;
        }

        .question-meta {
            font-size: 0.85em;
            color: #777;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .question-text {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--secondary-color);
        }

        .options-list {
            list-style: none;
            padding: 0;
        }

        .option-item {
            margin-bottom: 12px;
        }

        .option-btn {
            width: 100%;
            text-align: left;
            padding: 15px;
            border: 2px solid #eee;
            background: #fff;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1em;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-color);
            background: #fff8f8;
        }

        .option-btn.correct {
            border-color: var(--success-color);
            background: #e9f7ef;
            color: var(--success-color);
            font-weight: bold;
        }

        .option-btn.wrong {
            border-color: var(--error-color);
            background: #fdf2f2;
            color: var(--error-color);
        }

        /* Retroalimentación */
        .feedback {
            margin-top: 20px;
            padding: 20px;
            border-radius: var(--border-radius);
            display: none;
        }

        .feedback.visible { display: block; }
        .feedback.correct-bg { background: #e9f7ef; border-left: 5px solid var(--success-color); }
        .feedback.wrong-bg { background: #fdf2f2; border-left: 5px solid var(--error-color); }

        .feedback-title { font-weight: bold; margin-bottom: 5px; }
        .feedback-concept { font-size: 0.95em; color: #444; }

        /* Controles */
        .controls {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-nav {
            padding: 10px 25px;
            border: none;
            border-radius: var(--border-radius);
            background: var(--secondary-color);
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.3s;
        }

        .btn-nav:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-nav:hover:not(:disabled) { opacity: 0.9; }

        .score-display { font-weight: bold; color: var(--primary-color); }

        /* Animaciones */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate { animation: fadeIn 0.4s ease-out; }

        pre {
            background: #f8f8f8;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            overflow-x: auto;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .quiz-container { padding: 15px; }
            .tab-btn { padding: 8px 12px; font-size: 0.9em; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Simulador de Examen: Redes y Comunicación de Datos I</h1>
        <div class="author">Preparado para: <strong>Max Anderson Benites Corazón</strong> - Senior Technical Implementation Specialist</div>
    </header>

    <div class="tabs" id="tabBar">
        <button class="tab-btn active" onclick="changeWeek('S5')">Semana 5</button>
        <button class="tab-btn" onclick="changeWeek('S6')">Semana 6</button>
        <button class="tab-btn" onclick="changeWeek('S7')">Semana 7</button>
        <button class="tab-btn" onclick="changeWeek('S8')">Semana 8</button>
        <button class="tab-btn" onclick="changeWeek('S9')">Semana 9</button>
    </div>

    <div class="quiz-container" id="quizBox">

    </div>
</div>

    let currentWeek = 'S5';
    let currentQuestionIdx = 0;
    let score = 0;
    let answered = false;

    function initQuiz() {
        renderQuestion();
    }

    function changeWeek(week) {
        currentWeek = week;
        currentQuestionIdx = 0;
        score = 0;
        answered = false;
        
        // Update tabs UI
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.toggle('active', btn.textContent.includes(week.replace('S', '')));
        });
        
        renderQuestion();
    }

    function renderQuestion() {
        const quizBox = document.getElementById('quizBox');
        const questions = quizData[currentWeek];
        const q = questions[currentQuestionIdx];

        quizBox.innerHTML = `
            <div class="animate">
                <div class="question-meta">
                    <span>Semana ${currentWeek.replace('S','')}</span>
                    <span>Pregunta ${currentQuestionIdx + 1} de ${questions.length}</span>
                </div>
                <div class="question-text">${q.q}</div>
                <div class="options-list" id="options">
                    ${q.o.map((opt, i) => `
                        <div class="option-item">
                            <button class="option-btn" onclick="checkAnswer(${i})">${opt}</button>
                        </div>
                    `).join('')}
                </div>
                <div id="feedback" class="feedback">
                    <div class="feedback-title" id="feedbackTitle"></div>
                    <div class="feedback-concept" id="feedbackConcept">${q.f}</div>
                </div>
                <div class="controls">
                    <div class="score-display">Puntaje: ${score}/${questions.length}</div>
                    <button class="btn-nav" id="nextBtn" onclick="nextQuestion()" disabled>Siguiente</button>
                </div>
            </div>
        `;
        answered = false;
    }

    function checkAnswer(idx) {
        if (answered) return;
        answered = true;

        const q = quizData[currentWeek][currentQuestionIdx];
        const options = document.querySelectorAll('.option-btn');
        const feedback = document.getElementById('feedback');
        const feedbackTitle = document.getElementById('feedbackTitle');
        const nextBtn = document.getElementById('nextBtn');

        options.forEach((btn, i) => {
            btn.disabled = true;
            if (i === q.a) {
                btn.classList.add('correct');
            } else if (i === idx) {
                btn.classList.add('wrong');
            }
        });

        if (idx === q.a) {
            score++;
            feedback.classList.add('visible', 'correct-bg');
            feedbackTitle.innerText = "¡Correcto!";
        } else {
            feedback.classList.add('visible', 'wrong-bg');
            feedbackTitle.innerText = "Incorrecto";
        }

        nextBtn.disabled = false;
        // Update score in UI immediately
        document.querySelector('.score-display').innerText = `Puntaje: ${score}/${quizData[currentWeek].length}`;
    }

    function nextQuestion() {
        currentQuestionIdx++;
        if (currentQuestionIdx < quizData[currentWeek].length) {
            renderQuestion();
        } else {
            showFinalScore();
        }
    }

    function showFinalScore() {
        const quizBox = document.getElementById('quizBox');
        const total = quizData[currentWeek].length;
        const percent = Math.round((score / total) * 100);
        
        let message = "";
        if (percent === 100) message = "¡Excelente, Max! Dominas perfectamente los conceptos.";
        else if (percent >= 80) message = "¡Muy bien! Estás listo para el examen.";
        else if (percent >= 60) message = "Buen trabajo, pero te recomiendo repasar algunos conceptos.";
        else message = "Necesitas repasar más los materiales de esta semana.";

        quizBox.innerHTML = `
            <div class="animate" style="text-align:center; padding: 40px 0;">
                <h2 style="color: var(--primary-color);">Simulacro Finalizado</h2>
                <div style="font-size: 3em; font-weight: bold; margin: 20px 0;">${percent}%</div>
                <p style="font-size: 1.2em;">Has acertado <strong>${score}</strong> de <strong>${total}</strong> preguntas.</p>
                <p>${message}</p>
                <button class="btn-nav" style="margin-top:20px;" onclick="changeWeek('${currentWeek}')">Reiniciar Semana</button>
            </div>
        `;
    }

    // Inicializar
    window.onload = initQuiz;
